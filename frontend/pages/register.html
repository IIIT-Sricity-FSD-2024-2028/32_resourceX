<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Organization - ResourceX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .register-body {
            background: linear-gradient(135deg, var(--rx-primary) 0%, #1a237e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .plan-card {
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .plan-card:hover {
            transform: translateY(-5px);
            border-color: var(--rx-primary);
        }
        .plan-card.selected {
            border-color: var(--rx-primary);
            background-color: rgba(63, 81, 181, 0.05);
        }
    </style>
</head>
<body class="register-body">

    <div class="register-card">
        <div class="text-center mb-4">
            <h1 class="fw-bold" style="color: var(--rx-primary);">ResourceX</h1>
            <p class="text-muted">Register your Organization</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Organization Name</label>
                    <input type="text" class="form-control" id="orgName" required placeholder="Acme Corp">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Your Name (System Admin)</label>
                    <input type="text" class="form-control" id="adminName" required placeholder="Jordan Smith">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Admin Email</label>
                    <input type="email" class="form-control" id="adminEmail" required placeholder="admin@acme.com">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Create a password" minlength="8">
                    <div class="form-text">At least 8 characters, with an uppercase letter, a number, and a symbol.</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required placeholder="Re-enter your password">
                </div>
                <div class="col-md-6 mb-3" id="passwordErrorWrap" style="display:none;">
                    <div class="alert alert-danger py-2 px-3 mb-0" id="passwordError"></div>
                </div>
            </div>

            <h5 class="mb-3">Select a Subscription Plan</h5>
            <div class="row mb-4" id="plansContainer">
                <div class="col-12 text-center text-muted">Loading plans...</div>
            </div>
            
            <input type="hidden" id="selectedPlan" required>

            <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Register Organization</button>
            
            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none">Already have an account? Sign in</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/pages/register.js"></script>
</body>
</html>
